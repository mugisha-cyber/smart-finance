<!DOCTYPE html>
<html>

<head>
    <title>Employee Management System</title>

    <style>
        #action_btn {
            margin-bottom: 10px;
            padding: 10px;
        }
        
        #action_btn button {
            margin-right: 10px;
            padding: 5px 10px;
            color: rgb(19, 108, 185);
        }
        
        table {
            border-collapse: collapse;
        }
        
        th,
        td {
            padding: 10px;
            text-align: center;
        }
        
        #error-section {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>


    <center>
        <h1>Employee Management System</h1>

        <div id="action_btn">
            <button onclick="addEmployee()">Add Employee</button>
            <button onclick="removeEmployee()">Remove Employee</button>
            <button onclick="updateEmployeeSalary()">Update Salary</button>
            <button onclick="HighestPaidEmployee()">Highest Paid Employee</button>
        </div>

        <table border="3">
            <tr>
                <th>NO</th>
                <th>Employee Name</th>
                <th>Initial Salary</th>
                <th>Net Salary</th>
                <th>Security Fees</th>
                <th>TAX DEDUCTED</th>
            </tr>

            <tbody id="employeeTableBody"></tbody>
        </table>

        <p id="error-section"></p>
    </center>
    <script src="../Javascript/framework.js"></script>
</body>

</html>

</html>
