<!DOCTYPE html>
<html>

<head>
    <title>Arrays in JS</title>
</head>

<body>

    <script>
        var NAMES = new Array();

        NAMES[0] = "Mugisha";
        NAMES[1] = "Elise";
        NAMES[2] = "Ferdinand";
        NAMES[3] = "Vanali";
        NAMES[4] = "Bernard";
        NAMES[5] = "DENYSE";
        NAMES[6] = "Prisca";
        for (var x in NAMES) {
            document.write(NAMES[x] + "<br>");
        }
    </script>

</body>

</html>
